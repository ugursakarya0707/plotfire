version: '3.8'

services:
  livekit-service:
    build: .
    container_name: livekit-service
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - postply-network

networks:
  postply-network:
    name: postply-network
