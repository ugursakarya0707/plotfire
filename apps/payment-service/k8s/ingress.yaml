apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-service-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - host: payment.postply.local
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 3007
